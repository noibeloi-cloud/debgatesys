# Builds the Windows and macOS installers on GitHub's free runners — no Mac required.
# Use:  push this folder to a GitHub repository → Actions tab → "Build desktop apps" → Run workflow.
# When it finishes, download the installers from the run's "Artifacts" section.
name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Electron + builder
        run: npm install --save-dev electron electron-builder
      - name: Run tests
        run: npm test
      - name: Build installers
        run: npx electron-builder ${{ matrix.flag }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
